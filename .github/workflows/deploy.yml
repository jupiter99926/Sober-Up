
name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # Or your default branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Match your development environment node version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Use 'ci' for cleaner installs in CI/CD

      - name: Build Next.js app
        run: npm run build
        env:
          # Set necessary environment variables for the build process
          # Ensure these are available in your GitHub secrets if needed for build
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }} # Assuming you have this for Genkit

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}' # Default token for GitHub Actions
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOBER_UP_OY26Q }}' # Use the service account key JSON
          channelId: live # Deploy to the live channel
          projectId: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }} # Or hardcode 'road-to-recovery-oy26q' if preferred

# Note:
# You need to configure the following secrets in your GitHub repository settings (Settings > Secrets and variables > Actions):
# 1. FIREBASE_SERVICE_ACCOUNT_SOBER_UP_OY26Q: The JSON content of your Firebase service account key.
#    - Go to Firebase Console > Project Settings > Service accounts > Generate new private key.
#    - Copy the entire JSON content and paste it as the value for this secret.
# 2. NEXT_PUBLIC_FIREBASE_API_KEY: Your Firebase Web API Key.
# 3. NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: Your Firebase Auth Domain.
# 4. NEXT_PUBLIC_FIREBASE_PROJECT_ID: Your Firebase Project ID ('road-to-recovery-oy26q').
# 5. NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: Your Firebase Storage Bucket.
# 6. NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: Your Firebase Messaging Sender ID.
# 7. NEXT_PUBLIC_FIREBASE_APP_ID: Your Firebase App ID.
# 8. NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: Your Firebase Measurement ID (Optional).
# 9. GOOGLE_GENAI_API_KEY: Your Google AI API Key for Genkit features.
#
# This workflow assumes your Firebase project ID is 'road-to-recovery-oy26q'.
# It will automatically build and deploy your Next.js application to Firebase Hosting
# whenever you push changes to the 'main' branch.

